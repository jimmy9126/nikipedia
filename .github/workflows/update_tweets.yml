name: Nightly NikiPedia Sync

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight UTC
  workflow_dispatch: # Allows you to run it manually via the Actions tab

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows the action to commit data back to your repo

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Fixed the parameter declaration flag

    - name: Install Script Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Scraper Engine
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} # FIXED: Injected the OpenAI secret here
      run: python scraper.py

    - name: Commit and Push Updates
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add docs/tweets.json
        git diff-index --quiet HEAD || (git commit -m "Automated Sync: New tweets cataloged" && git push)

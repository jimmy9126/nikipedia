<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NikiPedia — The Nikita Bier Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans">

    <div id="app" class="max-w-6xl mx-auto px-4 py-8">
        <header class="text-center mb-12 border-b border-gray-800 pb-8">
            <h1 class="text-5xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">
                NikiPedia
            </h1>
            <p class="text-gray-400 mt-3 text-lg">Categorized startup & viral growth frameworks by Nikita Bier</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-8">
            <aside class="md:col-span-1">
                <h2 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">Filter Topics</h2>
                <div class="space-y-1">
                    <button 
                        v-for="cat in categories" 
                        @click="setCategory(cat)"
                        :class="selectedCategory === cat ? 'bg-blue-600 text-white' : 'text-gray-400 hover:bg-gray-800 hover:text-gray-200'"
                        class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium transition">
                        {{ cat }}
                    </button>
                </div>
            </aside>

            <main class="md:col-span-3">
                <div v-if="visibleTweets.length === 0" class="text-center py-12 text-gray-500">
                    No insights loaded under this section yet.
                </div>
                
                <div class="space-y-6">
                    <div v-for="tweet in visibleTweets" :key="tweet.id" class="bg-gray-950 p-4 rounded-xl border border-gray-800 shadow-xl">
                        <span class="inline-block text-xs font-bold px-2.5 py-1 rounded-full bg-gray-800 text-emerald-400 mb-4">
                            {{ tweet.category }}
                        </span>
                        
                        <blockquote class="twitter-tweet" data-theme="dark" data-conversation="none">
                            <a :href="'https://twitter.com/nikitabier/status/' + tweet.id"></a>
                        </blockquote>
                    </div>
                </div>

                <!-- Load More Pagination Control -->
                <div v-if="visibleTweets.length < filteredTweets.length" class="text-center mt-12">
                    <button @click="loadMore" class="bg-gray-800 hover:bg-gray-700 text-white font-medium py-2.5 px-6 rounded-xl transition shadow-md">
                        Load More Entries
                    </button>
                </div>
            </main>
        </div>
    </div>

    <script>
        const { createApp, ref, computed, onMounted, nextTick } = Vue;

        createApp({
            setup() {
                const tweets = ref([]);
                const selectedCategory = ref('All Topics');
                const displayLimit = ref(10); // Start with 10 to keep X embeds fast
                const categories = ['All Topics', 'Viral Growth Loops', 'Product Strategy', 'Consumer Psychology', 'Fundraising & Exits', 'Satire & Humor'];

                const loadTweets = async () => {
                    try {
                        const res = await fetch('./tweets.json?t=' + Date.now());
                        tweets.value = await res.json();
                        renderXWidgets();
                    } catch (err) {
                        console.error("Failed to load tweets database", err);
                    }
                };

                const renderXWidgets = () => {
                    nextTick(() => {
                        if (window.twttr && window.twttr.widgets) {
                            window.twttr.widgets.load();
                        }
                    });
                };

                onMounted(loadTweets);

                const filteredTweets = computed(() => {
                    if (selectedCategory.value === 'All Topics') return tweets.value;
                    return tweets.value.filter(t => t.category === selectedCategory.value);
                });

                const visibleTweets = computed(() => {
                    return filteredTweets.value.slice(0, displayLimit.value);
                });

                const setCategory = (cat) => {
                    selectedCategory.value = cat;
                    displayLimit.value = 10; // Reset pagination window
                    renderXWidgets();
                };

                const loadMore = () => {
                    displayLimit.value += 10;
                    renderXWidgets();
                };

                return { tweets, categories, selectedCategory, filteredTweets, visibleTweets, setCategory, loadMore };
            }
        }).mount('#app');
    </script>
</body>
</html>
